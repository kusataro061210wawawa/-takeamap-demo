<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123D2B">
  <title>Take A Map（試作）</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Take A Map">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 読む（最初の画面） -->
    <section id="view-read" class="view active"></section>

    <!-- 地図の画面。探す・予定（つくる／たどる）で同じ地図を使い、上と下の中身だけ入れ替える -->
    <section id="view-map" class="view">
      <div id="map"></div>
      <div class="map-top">
        <div class="search" id="top-search">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <span id="search-text">大宮　場所や趣味で探す</span>
          <span class="demo-badge">試作・データは仮</span>
        </div>
        <div class="stage-bar" id="stage-bar" hidden></div>
        <div id="chips" class="chips"></div>
        <div id="modes" class="modes"></div>
      </div>
      <div id="sheet" class="sheet peek">
        <div class="sheet-handle" id="sheet-handle"><span></span></div>
        <div class="sheet-head" id="sheet-head"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </section>

    <!-- 記録（いまはタブから外している。書く画面を作るときに使う） -->
    <section id="view-record" class="view"></section>
    <!-- マイページ -->
    <section id="view-me" class="view"></section>

    <!-- 上に重なる画面（記事・書き手・組み直しの結果・自分のマップ） -->
    <section id="panel" class="panel"></section>

    <nav class="tabbar" id="tabbar">
      <button data-view="read" class="on"><svg viewBox="0 0 24 24"><path d="M12 7c-2-1.6-5-2.2-8-1.7v13c3-.5 6 .1 8 1.7 2-1.6 5-2.2 8-1.7v-13c-3-.5-6 .1-8 1.7z"/><path d="M12 7v13"/></svg>読む</button>
      <button data-view="map"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>探す</button>
      <div class="tab-write-wrap"><button class="tab-write" id="write-btn" aria-label="記事を書く"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.5 5.1a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.6 18.8z"/><path d="M14 6.5l3.5 3.5"/></svg></button></div>
      <div class="tab-plan" id="tab-plan">
        <div class="plan-menu" id="plan-menu">
          <button data-plan="make"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M12 12.5v5M9.5 15h5"/></svg>つくる</button>
          <button data-plan="follow"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a3 3 0 000-6h-4a3 3 0 010-6h6"/></svg>たどる</button>
        </div>
        <button data-view="plan" id="plan-tab"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>予定</button>
      </div>
      <button data-view="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 20c1.5-4 4.5-5 8-5s6.5 1 8 5"/></svg>マイページ</button>
    </nav>
    <div id="toast" class="toast"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/rebuild.js"></script>
  <script src="js/app.js"></script>
  <script>
    // オフラインでも開けるようにサービスワーカーを登録（file:// で開いたときは何もしない）
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
