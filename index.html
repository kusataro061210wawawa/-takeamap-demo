<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123D2B">
  <title>Take A Map（試作）</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Take A Map">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 地図（ホーム） -->
    <section id="view-map" class="view active">
      <div id="map"></div>
      <div class="map-top">
        <div class="search">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <span id="search-text">大宮　場所や趣味で探す</span>
          <span class="demo-badge">試作・データは仮</span>
        </div>
        <div id="chips" class="chips"></div>
        <div id="modes" class="modes"></div>
      </div>
      <div id="sheet" class="sheet peek">
        <div class="sheet-handle" id="sheet-handle"><span></span></div>
        <div class="sheet-head" id="sheet-head"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </section>

    <!-- 予定 -->
    <section id="view-plan" class="view"></section>
    <!-- 記録 -->
    <section id="view-record" class="view"></section>
    <!-- 自分 -->
    <section id="view-me" class="view"></section>

    <!-- 上に重なる画面（記事・書き手・組み直しの結果） -->
    <section id="panel" class="panel"></section>

    <nav class="tabbar" id="tabbar">
      <button data-view="map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>地図</button>
      <button data-view="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>予定</button>
      <button data-view="record"><svg viewBox="0 0 24 24"><path d="M5 19l1-4L16 5l3 3L9 18l-4 1z"/></svg>記録</button>
      <button data-view="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 20c1.5-4 4.5-5 8-5s6.5 1 8 5"/></svg>自分</button>
    </nav>
    <div id="toast" class="toast"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/rebuild.js"></script>
  <script src="js/app.js"></script>
  <script>
    // オフラインでも開けるようにサービスワーカーを登録（file:// で開いたときは何もしない）
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
